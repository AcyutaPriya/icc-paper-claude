name: ICC Bot

on:
  # No GitHub `schedule:` on purpose. GitHub's scheduler can fire hours late (even after the
  # close). Runs are started on time by an outside timer (cron-job.org) calling this
  # workflow_dispatch trigger, see README.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Analyse only, place no orders"
        type: boolean
        default: true

permissions:
  contents: write   # lets the bot commit its diary/ files

concurrency:
  group: icc-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run strategy tests
        run: python test_icc.py

      - name: Run bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ALPACA_PAPER: ${{ vars.ALPACA_PAPER || 'true' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          LIVE_CONFIRM: ${{ secrets.LIVE_CONFIRM }}
        run: python bot.py ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}

      - name: Upload decision log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decisions-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 30

      - name: Save diary to the repo
        if: always()
        run: |
          git config user.name "icc-bot"
          git config user.email "icc-bot@users.noreply.github.com"
          git add diary
          if ! git diff --cached --quiet; then
            git commit -m "diary: $(date -u +%Y-%m-%d\ %H:%M) UTC"
            git push || (git pull --rebase && git push)
          fi
